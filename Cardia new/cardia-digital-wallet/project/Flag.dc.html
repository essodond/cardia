<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%;border-radius:2px;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.15);line-height:0">
<svg viewBox="0 0 30 20" width="100%" height="100%" preserveAspectRatio="none" style="display:block">
<sc-if value="{{ isTG }}"><rect width="30" height="20" fill="#006A4E"></rect><rect y="4" width="30" height="4" fill="#FFCE00"></rect><rect y="12" width="30" height="4" fill="#FFCE00"></rect><rect width="12" height="12" fill="#D21034"></rect><path d="M0-1L.225-.309L.951-.309L.363.118L.588.809L0 .382L-.588.809L-.363.118L-.951-.309L-.225-.309Z" fill="#fff" transform="translate(6 6.3) scale(3.6)"></path></sc-if>
<sc-if value="{{ isCI }}"><rect width="10" height="20" fill="#F77F00"></rect><rect x="10" width="10" height="20" fill="#fff"></rect><rect x="20" width="10" height="20" fill="#009E60"></rect></sc-if>
<sc-if value="{{ isGH }}"><rect width="30" height="6.67" fill="#CE1126"></rect><rect y="6.67" width="30" height="6.67" fill="#FCD116"></rect><rect y="13.33" width="30" height="6.67" fill="#006B3F"></rect><path d="M0-1L.225-.309L.951-.309L.363.118L.588.809L0 .382L-.588.809L-.363.118L-.951-.309L-.225-.309Z" fill="#000" transform="translate(15 10.4) scale(3.3)"></path></sc-if>
<sc-if value="{{ isBJ }}"><rect width="30" height="20" fill="#FCD116"></rect><rect y="10" width="30" height="10" fill="#E8112D"></rect><rect width="12" height="20" fill="#008751"></rect></sc-if>
<sc-if value="{{ isSN }}"><rect width="10" height="20" fill="#00853F"></rect><rect x="10" width="10" height="20" fill="#FDEF42"></rect><rect x="20" width="10" height="20" fill="#E31B23"></rect><path d="M0-1L.225-.309L.951-.309L.363.118L.588.809L0 .382L-.588.809L-.363.118L-.951-.309L-.225-.309Z" fill="#00853F" transform="translate(15 10.4) scale(3.2)"></path></sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:90,&quot;height&quot;:60},&quot;code&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;TG&quot;,&quot;CI&quot;,&quot;GH&quot;,&quot;BJ&quot;,&quot;SN&quot;],&quot;default&quot;:&quot;TG&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const c = this.props.code ?? 'TG';
    return { isTG: c === 'TG', isCI: c === 'CI', isGH: c === 'GH', isBJ: c === 'BJ', isSN: c === 'SN' };
  }
}
</script>
</body>
</html>
